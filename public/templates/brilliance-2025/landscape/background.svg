<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Stand-in for designer art: everything static, with the photo, name and copy areas left empty -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F07A2D"/><stop offset="0.5" stop-color="#E83E75"/><stop offset="1" stop-color="#8B3FA0"/>
    </linearGradient>
    <linearGradient id="brandDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F07A2D"/><stop offset="0.5" stop-color="#E83E75"/><stop offset="1" stop-color="#8B3FA0"/>
    </linearGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F07A2D"/><stop offset="1" stop-color="#E83E75"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="rgb(240,122,45)" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="rgb(232,62,117)" stop-opacity="0.45"/>
      <stop offset="1" stop-color="rgb(139,63,160)" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="rgb(139,63,160)" stop-opacity="0"/>
      <stop offset="0.4" stop-color="rgb(139,63,160)" stop-opacity="0.08"/>
      <stop offset="0.6" stop-color="rgb(232,62,117)" stop-opacity="0.06"/>
      <stop offset="1" stop-color="rgb(232,62,117)" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowPurple">
      <stop offset="0" stop-color="rgb(139,63,160)" stop-opacity="0.18"/><stop offset="0.65" stop-color="rgb(139,63,160)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange">
      <stop offset="0" stop-color="rgb(240,122,45)" stop-opacity="0.12"/><stop offset="0.65" stop-color="rgb(240,122,45)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0E0A1A"/>
  <rect x="1040" y="-100" width="200" height="600" fill="url(#stripe)" transform="rotate(15 1140 200)"/>
  <rect x="1050" y="80" width="55" height="55" rx="6.6" fill="url(#diamond)" stroke="rgba(232,62,117,0.4)" stroke-width="1.5" transform="rotate(45 1077.5 107.5)"/>
  <rect x="1100" y="170" width="30" height="30" rx="3.6" fill="url(#diamond)" stroke="rgba(232,62,117,0.4)" stroke-width="1.5" transform="rotate(45 1115 185)"/>
  <ellipse cx="1050" cy="47" rx="210" ry="173" fill="url(#glowPurple)"/>
  <rect width="1200" height="4" fill="url(#brand)"/>
  <rect y="612" width="1200" height="18" fill="url(#brand)"/>
  <!-- photo ring: the photo layer sits inside it -->
  <circle cx="150" cy="493" r="105" fill="url(#brandDiag)"/>
  <rect x="1110" y="496" width="45" height="2" fill="url(#divider)"/>
</svg>
